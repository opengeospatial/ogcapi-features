          description: Server Error
  /resources/{resourceId}:
    get:
      tags:
      - Discover and fetch other resources
      summary: "fetch the file resource `{resourceId}`"
      description: Fetches the file resource with identifier `resourceId`. The set
        of available resources can be retrieved at `/resources`.
      operationId: getResource
      parameters:
      - $ref: "#/components/parameters/resourceId"
      - $ref: "#/components/parameters/prettyCommon"
      responses:
        "200":
          description: The operation was executed successfully.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
