        "400":
          description: Bad Request
        "404":
          description: Not Found
        "412":
          description: Precondition Failed
        "428":
          description: Precondition Required
        "500":
          description: Server Error
    patch:
      tags:
      - Mutate data
      summary: update a feature in the feature collection 'buildings'
      description: "The content of the request is a JSON merge patch document (RFC\
        \ 7396). The id of the updated feature is `{featureId}`."
      operationId: buildings.updateItem
      parameters:
