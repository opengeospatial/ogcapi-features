      operationId: buildings.replaceItem
      parameters:
      - $ref: "#/components/parameters/featureId"
      - $ref: "#/components/parameters/ContentCrsCrudFeature"
      - $ref: "#/components/parameters/IfUnmodifiedSinceCrudFeature"
      - $ref: "#/components/parameters/LinkInRequest"
      - $ref: "#/components/parameters/PreferCrudFeature"
      requestBody:
