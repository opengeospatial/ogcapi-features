          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
  /collections/buildings/items:
    get:
      tags:
      - Access data
      summary: retrieve features in the feature collection 'buildings'
      description: |-
        The response is a document consisting of features in the collection. The features included in the response are determined by the server based on the query parameters of the request.

        To support access to larger collections without overloading the client, the API supports paged access with links to the next page, if more features are selected that the page size (maximum page size is 10000).

        The `bbox` and `datetime` parameter can be used to select only a subset of the features in the collection (the features that are in the bounding box or time interval). The `bbox` parameter matches all features in the collection that are not associated with a location, too. The `datetime` parameter matches all features in the collection that are not associated with a time stamp or interval, too. The `limit` parameter may be used to control the subset of the selected features that should be returned in the response, the page size. Each page may include information about the number of selected and returned features (`numberMatched` and `numberReturned`) as well as links to support paging (link relation `next`).

        See the details of this operation for a description of additional query parameters supported by this resource.
      operationId: buildings.getItems
      parameters:
      - $ref: "#/components/parameters/bbox"
      - $ref: "#/components/parameters/bbox-crsFeatures_buildings"
      - $ref: "#/components/parameters/crsFeatures_buildings"
      - $ref: "#/components/parameters/datetime"
      - $ref: "#/components/parameters/fFeatures"
      - $ref: "#/components/parameters/limitFeatures_buildings"
      - $ref: "#/components/parameters/offsetFeatures"
      - $ref: "#/components/parameters/prettyFeatures"
      - $ref: "#/components/parameters/profileFeatures_buildings"
      responses:
        "200":
          description: The operation was executed successfully.
          headers:
            Content-Bounding-Box:
              $ref: "#/components/headers/Content-Bounding-Box"
            Content-Crs:
              $ref: "#/components/headers/ContentCrsFeatures"
            Content-Temporal-Extent:
              $ref: "#/components/headers/Content-Temporal-Extent"
            Link:
              $ref: "#/components/headers/LinkInResponse"
          content:
            application/gml+xml;profile="http://www.opengis.net/def/profile/ogc/2.0/gml-sf0";version=3.2:
              schema:
                $ref: "#/components/schemas/anyObject"
            application/geo+json:
              schema:
                $ref: "#/components/schemas/featureCollectionGeoJson_buildings"
            text/html:
              schema:
                $ref: "#/components/schemas/htmlSchema"
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
    post:
      tags:
      - Mutate data
      summary: add a feature in the feature collection 'buildings'
      description: The content of the request is a new feature in one of the supported
        encodings. The URI of the new feature is returned in the header `Location`.
      operationId: buildings.createItem
      parameters:
      - $ref: "#/components/parameters/ContentCrsCrudFeature"
      - $ref: "#/components/parameters/LinkInRequest"
      - $ref: "#/components/parameters/PreferCrudFeature"
      requestBody:
        description: The new resource to be created.
        content:
          application/gml+xml:
            schema:
              $ref: "#/components/schemas/anyObject"
          application/geo+json:
            schema:
              $ref: "#/components/schemas/anyObject"
        required: false
      responses:
        "201":
          description: The operation was executed successfully.
          headers:
            Location:
              $ref: "#/components/headers/LocationCrudFeature"
          content: {}
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "415":
          description: Unsupported Media Type
        "422":
          description: Unprocessable Entity
        "500":
          description: Server Error
