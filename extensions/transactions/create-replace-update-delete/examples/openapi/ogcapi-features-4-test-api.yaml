openapi: 3.0.3
info:
  title: Buildings (Part 4 ATS)
  description: Test deployment for the Abstract Test Suite of OGC API - Features -
    Part 4 (draft)
  version: 1.0.0
servers:
- url: http://localhost:7080/buildings
tags: []
paths:
  /:
    get:
      tags:
      - Capabilities
      summary: landing page
      description: "The landing page provides links to the API definition (link relations\
        \ `service-desc` and `service-doc`), the Conformance declaration (path `/conformance`,\
        \ link relation `conformance`), and other resources in the API."
      operationId: getLandingPage
      parameters:
      - $ref: "#/components/parameters/fCommon"
      - $ref: "#/components/parameters/prettyCommon"
      responses:
        "200":
          description: The operation was executed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPage"
            text/html:
              schema:
                $ref: "#/components/schemas/htmlSchema"
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
  /conformance:
    get:
      tags:
      - Capabilities
      summary: conformance declaration
      description: "The URIs of all conformance classes supported by the server. This\
        \ information is provided to support 'generic' clients that want to access\
        \ multiple OGC API implementations - and not 'just' a specific API. For clients\
        \ accessing only a single API, this information is in general not relevant\
        \ and the OpenAPI definition details the required information about the API."
      operationId: getConformanceDeclaration
      parameters:
      - $ref: "#/components/parameters/fCommon"
      - $ref: "#/components/parameters/prettyCommon"
      responses:
        "200":
          description: The operation was executed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConformanceDeclaration"
            text/html:
              schema:
                $ref: "#/components/schemas/htmlSchema"
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
  /collections:
    get:
      tags:
      - Discover data collections
      summary: feature collections in the dataset 'Buildings (Part 4 ATS)'
      description: |-
        The dataset is organized in feature collections. This resource provides information about and access to the feature collections.
        The response contains the list of collections. For each collection, a link to the items in the collection (path `/collections/{collectionId}/items`, link relation `items`) as well as key information about the collection.
        This information includes:

        * A local identifier for the collection that is unique for the dataset;
        * A title and description for the collection;
        * An indication of the spatial and temporal extent of the data in the collection;
        * A list of coordinate reference systems (CRS) in which geometries may be returned by the server. The first CRS is the default coordinate reference system (the default is always WGS 84 with axis order longitude/latitude);
        * The CRS in which the spatial geometries are stored in the data source (if data is requested in this CRS, the geometries are returned without any coordinate conversion);
        * An indicator about the type of the items in the collection (the default value is 'feature').
      operationId: getCollections
      parameters:
      - $ref: "#/components/parameters/fCollections"
      - $ref: "#/components/parameters/prettyCommon"
      responses:
        "200":
          description: The operation was executed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collections"
            text/html:
              schema:
                $ref: "#/components/schemas/htmlSchema"
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
  /collections/buildings:
    get:
      tags:
      - Discover data collections
      summary: feature collection 'Buildings'
      description: |-
        Information about the feature collection with id 'buildings'. The response contains a link to the items in the collection (path `/collections/{collectionId}/items`,link relation `items`) as well as key information about the collection. This information includes:

        * A local identifier for the collection that is unique for the dataset;
        * A title and description for the collection;
        * An indication of the spatial and temporal extent of the data in the collection;
        * A list of coordinate reference systems (CRS) in which geometries may be returned by the server. The first CRS is the default coordinate reference system (the default is always WGS 84 with axis order longitude/latitude);
        * The CRS in which the spatial geometries are stored in the data source (if data is requested in this CRS, the geometries are returned without any coordinate conversion);
        * An indicator about the type of the items in the collection (the default value is 'feature').
      operationId: buildings.getCollection
      parameters:
      - $ref: "#/components/parameters/fCollection"
      - $ref: "#/components/parameters/prettyCommon"
      responses:
        "200":
          description: The operation was executed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
            text/html:
              schema:
                $ref: "#/components/schemas/htmlSchema"
        "400":
          description: Bad Request
        "406":
          description: Not Acceptable
        "500":
          description: Server Error
  /collections/buildings_upsert:
    get:
      tags:
      - Discover data collections
      summary: feature collection 'Buildings (client-assigned ids)'
      description: |-
        Information about the feature collection with id 'buildings_upsert'. The response contains a link to the items in the collection (path `/collections/{collectionId}/items`,link relation `items`) as well as key information about the collection. This information includes:

