---
id: buildings
enabled: true
serviceType: OGC_API
accessControl:
  enabled: false
label: Buildings (Part 4 ATS)
description: Test deployment for the Abstract Test Suite of OGC API - Features - Part 4 (draft)
api:
- buildingBlock: FEATURES_CORE
  enabled: true
- buildingBlock: GEO_JSON
  enabled: true
- buildingBlock: CRS
  enabled: true
  additionalCrs:
  - code: 25832
    forceAxisOrder: NONE
- buildingBlock: SCHEMA
  enabled: true
- buildingBlock: JSON_FG
  enabled: true
- buildingBlock: CRUD
  enabled: true
  optimisticLockingLastModified: true
- buildingBlock: SCHEMA_VALIDATION
  enabled: true
- buildingBlock: RESOURCES
  enabled: true
- buildingBlock: GML
  enabled: true
  gmlVersion: GML32
  gmlSfLevel: 0
  applicationNamespaces:
    bldg: https://example.org/buildings
  defaultNamespace: bldg
  schemaLocations:
    # the application schema is published by the API itself (RESOURCES building block)
    bldg: http://localhost:7080/buildings/resources/buildings.xsd
collections:
  buildings:
    id: buildings
    label: Buildings
    enabled: true
  buildings_upsert:
    id: buildings_upsert
    label: Buildings (client-assigned ids)
    enabled: true
    api:
    # the same buildings, but new features are created with PUT on the resource
    # endpoint (the provider type has "{generated=false}" on the id property), so
    # this collection advertises "supportsNonAutogeneratedResourceIds": true.
    # Optimistic locking is off here: a PUT that creates a new feature has no
    # previous state, so requiring a precondition would make the upsert case
    # untestable.
    - buildingBlock: CRUD
      enabled: true
      optimisticLockingLastModified: false
