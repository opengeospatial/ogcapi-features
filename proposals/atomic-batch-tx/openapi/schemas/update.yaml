---
allOf:
- $ref: 'description.yaml'
- type: object
  required:
  - action
  - collection
  - properties
  properties:
    action:
      type: string
      enum: [ 'update' ]
    collection:
      type: string
    properties:
      type: object
      properties:
        add:
          type: array
          items:
            $ref: 'nameValuePair.yaml'
        modify:
          type: array
          items:
            $ref: 'nameValuePair.yaml'
        delete:
          type: array
          items:
            type: string
    filter:
      oneOf:
      - type: string
      - $ref: 'cql2.yaml#/components/schemas/booleanExpression'
    filter-lang:
      type: string
      enum: [ 'cql2-text', 'cql2-json' ]
      description: The default is `cql2-text` if `filter` is a string and `cql2-json` otherwise.
    filter-crs:
      type: string
      default: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
