---
allOf:
- $ref: 'description.yaml'
- type: object
  required:
  - action
  - collection
  properties:
    action:
      type: string
      enum: [ 'delete' ]
    collection:
      type: string
    filter:
      oneOf:
      - type: string
      - $ref: 'cql2.yaml#/components/schemas/booleanExpression'
    filter-lang:
      type: string
      enum: [ 'cql2-text', 'cql2-json' ]
      description: The default is `cql2-text` if `filter` is a string and `cql2-json` otherwise.
    filter-crs:
      type: string
      default: 'http://www.opengis.net/def/crs/OGC/1.3/CRS84'
